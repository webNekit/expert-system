<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Диагностика заболеваний гороха</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            100: '#f5f5f5',
                            200: '#eeeeee',
                            300: '#e0e0e0',
                            400: '#bdbdbd',
                            500: '#9e9e9e',
                            600: '#757575',
                            700: '#616161',
                            800: '#424242',
                            900: '#212121',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .loading-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .disease-card {
            transition: all 0.3s ease;
        }

        .disease-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Светлая тема (по умолчанию) */
        .light-theme {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
            --progress-bg: #e5e7eb;
            --card-bg: #ffffff;
        }

        /* Темная тема */
        .dark-theme {
            --bg-primary: #111827;
            --bg-secondary: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --border-color: #374151;
            --progress-bg: #374151;
            --card-bg: #1f2937;
        }

        body {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .main-container {
            background-color: var(--bg-primary);
            border-color: var(--border-color);
        }

        .text-primary {
            color: var(--text-primary);
        }

        .text-secondary {
            color: var(--text-secondary);
        }

        .border-color {
            border-color: var(--border-color);
        }

        .progress-bg {
            background-color: var(--progress-bg);
        }

        .card-bg {
            background-color: var(--card-bg);
        }
    </style>
</head>

<body class="light-theme">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-2xl main-container rounded-3xl shadow-xl px-8 py-10 border border-color">
            <!-- Кнопка переключения темы -->
            <div class="flex justify-end mb-4">
                <button id="themeToggle"
                    class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg"
                        class="h-6 w-6 text-gray-800 dark:text-yellow-300" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path id="themeIconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </button>
            </div>

            <h1 class="text-3xl font-semibold text-primary mb-6 text-center">Диагностика заболеваний гороха</h1>

            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-secondary">Прогресс диагностики</span>
                <span id="progressText" class="text-sm font-medium text-secondary">0%</span>
            </div>
            <div class="w-full progress-bg h-3 rounded-full overflow-hidden mb-8">
                <div id="progressBar" class="h-full bg-green-500 transition-all duration-300 ease-in-out"
                    style="width: 0%"></div>
            </div>

            <div id="questionBlock">
                <div id="question" class="text-lg font-medium mb-8 text-center text-primary">Загрузка данных...</div>
                <div class="flex justify-center gap-4 mb-8">
                    <button id="yesBtn"
                        class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold py-2.5 px-6 rounded-full transition duration-200 shadow-md">
                        Да
                    </button>
                    <button id="noBtn"
                        class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold py-2.5 px-6 rounded-full transition duration-200 shadow-md">
                        Нет
                    </button>
                </div>
                <div id="confidenceIndicator" class="hidden">
                    <div class="text-sm text-secondary mb-2">Уверенность в текущем диагнозе:</div>
                    <div class="w-full progress-bg h-2 rounded-full overflow-hidden">
                        <div id="confidenceBar" class="h-full bg-blue-500 transition-all duration-300 ease-in-out"
                            style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div id="diagnosis" class="hidden mt-8">
                <div id="result" class="text-primary">
                    <div id="mainResult" class="mb-8"></div>

                    <div class="mb-6">
                        <h3 class="text-lg font-semibold mb-3 text-primary">Все возможные заболевания:</h3>
                        <div id="allDiseasesList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                    </div>

                    <div class="flex justify-center gap-4">
                        <button id="restartBtn"
                            class="bg-gray-700 hover:bg-gray-800 text-white text-sm font-semibold py-2.5 px-6 rounded-full transition duration-200">
                            Начать заново
                        </button>
                    </div>
                </div>
            </div>

            <div id="loading" class="text-center py-8 hidden">
                <div class="loading-pulse text-secondary">Генерация отчёта...</div>
            </div>

            <div id="diseaseGraph" class="mt-8">
                <canvas id="confidenceChart" height="200"></canvas>
            </div>
        </div>
    </div>
    <script src="./plugins/app.js"></script>
</body>

</html>
